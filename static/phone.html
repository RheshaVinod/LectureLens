<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LectureLens — Board Camera</title>
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:#0f1115;color:#e8e8ec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;}
  h1{font-size:1.1rem;margin:0 0 4px;}
  .sub{color:#8a8f9a;font-size:0.85rem;margin:0 0 28px;text-align:center;}
  label.shutter{width:140px;height:140px;border-radius:50%;background:#2b3b57;border:3px solid #6aa9ff;
    display:flex;align-items:center;justify-content:center;font-size:2.4rem;cursor:pointer;user-select:none;
    transition:transform .1s ease;}
  label.shutter:active{transform:scale(.94);}
  input[type=file]{display:none;}
  .status{margin-top:18px;font-size:0.85rem;color:#8a8f9a;min-height:1.2em;text-align:center;}
  .status.ok{color:#6aff95;}
  .status.err{color:#ff8a8a;}
  .recent{margin-top:28px;width:100%;max-width:420px;}
  .recent h2{font-size:0.75rem;text-transform:uppercase;letter-spacing:.05em;color:#8a8f9a;margin:0 0 10px;}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;}
  .thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #262a33;}
  .needs-session{color:#ff8a8a;text-align:center;margin-top:40px;font-size:0.95rem;line-height:1.5;}
</style>
</head>
<body>
  <h1>LectureLens</h1>
  <p class="sub">Point at the board, tap, and add the photo to the shared lecture timeline.</p>

  <div id="main" hidden>
    <label class="shutter" for="photoInput">📷</label>
    <input id="photoInput" type="file" accept="image/*" capture="environment" />
    <div id="status" class="status">Ready</div>
    <div class="recent">
      <h2 id="recentLabel">Recent captures</h2>
      <div id="thumbs" class="thumbs"></div>
    </div>
  </div>

  <div id="needsSession" class="needs-session" hidden>
    This phone link is incomplete or expired.<br/>Generate a new QR code from the main LectureLens tab.
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get("session");
    const joinToken = params.get("token");
    const main = document.getElementById("main");
    const needsSession = document.getElementById("needsSession");
    const input = document.getElementById("photoInput");
    const statusEl = document.getElementById("status");
    const thumbs = document.getElementById("thumbs");

    if (!sessionId || !joinToken) {
      needsSession.hidden = false;
    } else {
      main.hidden = false;
    }

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? ` ${kind}` : "");
    }

    input.addEventListener("change", async () => {
      const file = input.files[0];
      input.value = "";
      if (!file) return;
      setStatus("Uploading…");
      const form = new FormData();
      form.append("image", file, "board.jpg");
      form.append("source", "phone");
      form.append("capture_reason", "phone");
      form.append("join_token", joinToken);
      try {
        const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/snapshots`, {
          method: "POST",
          body: form,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Upload failed");
        const seconds = Math.floor(data.captured_at_ms / 1000);
        setStatus(`Added at ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")} ✓`, "ok");
        const img = document.createElement("img");
        img.src = data.image_url;
        thumbs.prepend(img);
        while (thumbs.children.length > 8) thumbs.removeChild(thumbs.lastChild);
      } catch (err) {
        setStatus(err.message || "Upload failed", "err");
      }
    });
  </script>
</body>
</html>
